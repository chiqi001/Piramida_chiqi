name: Odśwież listę WIG

# Uruchamiaj ręcznie po każdej zmianie wig_isin.csv (np. po kwartalnej rewizji indeksu).
on:
  workflow_dispatch:
  push:
    paths: ["wig_isin.csv"]

permissions:
  contents: write

concurrency:
  group: smi-bot-git
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python resolve_wig.py
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain wig_symbols.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add wig_symbols.csv
            git commit -m "Aktualizacja symboli WIG [skip ci]"
            git pull --rebase --quiet || true
            git push
          fi
