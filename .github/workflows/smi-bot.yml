name: SMI Telegram Bot

# Spółki z WIG (GPW). Repozytorium publiczne = GitHub Actions za darmo, bez limitu minut.
# Sekrety: TELEGRAM_TOKEN, TELEGRAM_CHAT_ID.

on:
  schedule:
    # co 5 minut, pon–pt, 7:00–16:59 UTC (pokrywa sesję GPW 9:00–17:00 czasu PL zimą i latem)
    - cron: "1-59/5 7-16 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Wyślij krótką wiadomość testową"
        type: boolean
        default: false
      replay_day:
        description: "Wyślij sygnały z dnia: RRRR-MM-DD albo 'wczoraj' (puste = normalna praca)"
        type: string
        default: ""

permissions:
  contents: write   # zapis state.json i commit keepalive
  actions: write    # ponowne włączenie workflow (keepalive)

concurrency:
  group: smi-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          LONG_LEVEL: ${{ vars.LONG_LEVEL }}
          SHORT_ENABLED: ${{ vars.SHORT_ENABLED }}
          SHORT_LEVEL: ${{ vars.SHORT_LEVEL }}
          REARM_MARGIN: ${{ vars.REARM_MARGIN }}
          SEND_TEST: ${{ inputs.test }}
          REPLAY_DAY: ${{ inputs.replay_day }}
        run: python smi_bot.py

      - name: Save state + keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          changed=false

          # 1) zapis stanu sygnałów
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "Update bot state [skip ci]"
            changed=true
          fi

          # 2) keepalive: GitHub wyłącza harmonogram po 60 dniach bez aktywności.
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$days" -ge 40 ]; then
            git commit --allow-empty -m "keepalive [skip ci]"
            changed=true
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/smi-bot.yml/enable" || true
          fi

          if [ "$changed" = true ]; then
            for i in 1 2 3; do
              git pull --rebase --quiet && git push && break
              sleep 3
            done
          fi
